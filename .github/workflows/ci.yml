name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - release
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
    # Only run on a given PR if relevant files have changed.
    # (Both Node and PHP tasks will be dispatched, but they will exit early if
    # relevant files for that language are not altered within the PR.)
    paths:
      - '**.js'
      - '**.jsx'
      - '**.php'
      - '.babelrc.js'
      - '.eslintrc'
      - '.eslintignore'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'phpcs.xml'
      - 'languages/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    uses: ./.github/workflows/node.yml
    secrets: inherit

  php:
    uses: ./.github/workflows/php.yml
    secrets: inherit

  i18n:
    name: Locale filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject underscore-named catalogues
        run: |
          # Translation catalogues must be hyphen-named (fr-FR.mo, not fr_FR.mo)
          # to match the locale WordPress resolves under MultilingualPress; an
          # underscore name silently falls back to English on the live subsite.
          # ponytail: catches underscore-vs-hyphen only. A wrong-but-hyphenated
          # name (e.g. fr-CA.mo for an fr-FR subsite) still slips through; add a
          # per-locale load assertion if that ever bites.
          if git ls-files 'languages/*.po' 'languages/*.mo' | grep '_'; then
            echo "::error::Translation catalogues must use hyphenated locale names (e.g. fr-FR.mo, not fr_FR.mo)."
            exit 1
          fi
