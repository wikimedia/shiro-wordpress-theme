version: 2

updates:
  # JavaScript build/tooling dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    versioning-strategy: "lockfile-only"
    commit-message:
      prefix: "npm"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 25
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"

  # PHP dev tooling (phpcs, wpcs, and friends).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "composer"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10
    groups:
      composer-production:
        dependency-type: "production"
      composer-development:
        dependency-type: "development"

  # GitHub Actions pinned by SHA in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
